<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- Everything is served from the local application folder: no request ever
     leaves the machine.  Pictures that a document points at are downloaded by
     the host and served from https://cache.local/ (see the host's image
     cache), so the page itself never loads anything from the web.
     'unsafe-inline' is needed because KaTeX and Mermaid emit inline styles. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://app.local file:; style-src 'self' https://app.local file: 'unsafe-inline'; font-src 'self' https://app.local file:; img-src 'self' https://app.local https://cache.local https://local.local file: data: blob:; connect-src 'self' https://app.local; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
<title>JustViewMD</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="vendor/prism/prism.css" id="prismDark">
<link rel="stylesheet" href="vendor/prism/prism-light.css" id="prismLight" disabled>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="menubar" id="menubar">
    <button type="button" class="menubar-item" id="menuFile" data-menu="file"
            aria-haspopup="menu" aria-expanded="false">File</button>
    <button type="button" class="menubar-item" id="menuEdit" data-menu="edit"
            aria-haspopup="menu" aria-expanded="false">Edit</button>
    <button type="button" class="menubar-item" id="menuOptions" data-menu="options"
            aria-haspopup="menu" aria-expanded="false">Options</button>
    <span class="menubar-spacer"></span>
    <span class="menubar-hint" id="menubarHint"></span>
  </header>

  <div class="tabstrip">
    <div class="tabs" id="tabScroller">
      <div class="tab-list" id="tabList" role="tablist" aria-label="Open documents"></div>
      <button type="button" class="tab-add" id="tabAdd" title="New document (Ctrl+T)"
              aria-label="New document">+</button>
    </div>
  </div>

  <div class="findbar" id="findBar" hidden>
    <div class="find-row">
      <input type="text" id="findInput" class="find-input" placeholder="Find" spellcheck="false"
             autocomplete="off" aria-label="Find">
      <span class="find-count" id="findCount">0/0</span>
      <button type="button" class="find-button" id="findPrev" title="Previous match (Shift+Enter)"
              aria-label="Previous match">&#8593;</button>
      <button type="button" class="find-button" id="findNext" title="Next match (Enter)"
              aria-label="Next match">&#8595;</button>
      <button type="button" class="find-toggle" id="findCase" title="Match case">Aa</button>
      <button type="button" class="find-toggle" id="findWord" title="Whole word only">W</button>
      <button type="button" class="find-toggle" id="findRegex" title="Regular expression">.*</button>
    </div>
    <div class="find-row">
      <input type="text" id="replaceInput" class="find-input" placeholder="Replace with"
             spellcheck="false" autocomplete="off" aria-label="Replace with">
      <button type="button" class="find-button find-button-text" id="replaceOne"
              title="Replace this match (Ctrl+Shift+Enter)">Replace</button>
      <button type="button" class="find-button find-button-text" id="replaceAll"
              title="Replace all matches (Ctrl+Alt+Enter)">Replace All</button>
    </div>
    <button type="button" class="find-close" id="findClose" title="Close (Esc)"
            aria-label="Close find bar">&#215;</button>
  </div>

  <div class="workspace" id="workspace">

    <section class="pane pane-editor" id="editorPane">
      <div class="editor-viewport" id="editorViewport">
        <div class="gutter" id="gutter" aria-hidden="true"><div class="gutter-inner" id="gutterInner"></div></div>
        <div class="find-highlight" id="findHighlight" aria-hidden="true">
          <div class="find-highlight-inner" id="findHighlightInner"></div>
        </div>
        <textarea id="editor" class="editor" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="soft" aria-label="Markdown source"></textarea>
      </div>
      <div class="formatbar" id="formatBar" role="toolbar" aria-label="Insert formatting">
        <div class="format-group">
          <button type="button" class="format-button is-bold" data-format="bold"
                  title="Bold (Ctrl+B)" aria-label="Bold">B</button>
          <button type="button" class="format-button is-italic" data-format="italic"
                  title="Italic (Ctrl+I)" aria-label="Italic">I</button>
          <button type="button" class="format-button is-strike" data-format="strike"
                  title="Strikethrough" aria-label="Strikethrough">S</button>
          <button type="button" class="format-button is-mono" data-format="code"
                  title="Inline code" aria-label="Inline code">&lt;/&gt;</button>
          <button type="button" class="format-button" data-format="superscript"
                  title="Superscript" aria-label="Superscript">x<sup>2</sup></button>
          <button type="button" class="format-button" data-format="subscript"
                  title="Subscript" aria-label="Subscript">x<sub>2</sub></button>
        </div>
        <span class="format-sep" aria-hidden="true"></span>
        <div class="format-group">
          <button type="button" class="format-button" data-format="heading1"
                  title="Heading 1" aria-label="Heading 1">H1</button>
          <button type="button" class="format-button" data-format="heading2"
                  title="Heading 2" aria-label="Heading 2">H2</button>
          <button type="button" class="format-button" data-format="heading3"
                  title="Heading 3" aria-label="Heading 3">H3</button>
        </div>
        <span class="format-sep" aria-hidden="true"></span>
        <div class="format-group">
          <button type="button" class="format-button is-quote" data-format="quote"
                  title="Block quote" aria-label="Block quote">&rdquo;</button>
          <button type="button" class="format-button is-list" data-format="bullet"
                  title="Bulleted list" aria-label="Bulleted list">&#8226;</button>
          <button type="button" class="format-button is-list" data-format="number"
                  title="Numbered list" aria-label="Numbered list">1.</button>
          <button type="button" class="format-button" data-format="task"
                  title="Task list" aria-label="Task list">&#9745;</button>
          <button type="button" class="format-button is-mono" data-format="codeblock"
                  title="Code block" aria-label="Code block">{ }</button>
          <button type="button" class="format-button" data-format="table"
                  title="Table" aria-label="Table">&#9638;</button>
          <button type="button" class="format-button" data-format="rule"
                  title="Horizontal rule" aria-label="Horizontal rule">&#8213;</button>
          <button type="button" class="format-button" data-format="footnote"
                  title="Footnote" aria-label="Footnote">&#8224;</button>
        </div>
        <span class="format-sep" aria-hidden="true"></span>
        <div class="format-group">
          <button type="button" class="format-button" data-format="link"
                  title="Link (Ctrl+K)" aria-label="Link">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M6.6 9.4a3 3 0 004.2 0l1.6-1.6a3 3 0 00-4.2-4.2L7 5.4" fill="none"
                    stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
              <path d="M9.4 6.6a3 3 0 00-4.2 0L3.6 8.2a3 3 0 004.2 4.2L9 11.2" fill="none"
                    stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
            </svg>
          </button>
          <button type="button" class="format-button" data-format="image"
                  title="Image (relative paths resolve against this document)" aria-label="Image">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <rect x="2" y="3" width="12" height="10" rx="1.5" fill="none"
                    stroke="currentColor" stroke-width="1.3"></rect>
              <circle cx="5.6" cy="6.6" r="1.1" fill="currentColor"></circle>
              <path d="M3.2 11.8l3-3 2 2 2-2 2.6 3" fill="none"
                    stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"></path>
            </svg>
          </button>
          <button type="button" class="format-button" data-format="math"
                  title="Inline math ($…$)" aria-label="Inline math">&#8730;x</button>
          <button type="button" class="format-button" data-format="mathblock"
                  title="Display math ($$…$$)" aria-label="Display math">&#8721;</button>
          <button type="button" class="format-button" data-format="mermaid"
                  title="Mermaid diagram" aria-label="Mermaid diagram">&#9671;</button>
        </div>
      </div>
      <footer class="statusbar">
        <span class="status-item status-file" id="statusFile" title="Active document">Untitled.md</span>
        <span class="status-spacer"></span>
        <span class="status-item" id="statusCursor" title="Cursor position">Ln 1, Col 1</span>
        <span class="status-item" id="statusWords" title="Word count">0 words</span>
        <span class="status-item" id="statusChars" title="Character count">0 chars</span>
        <span class="status-item" id="statusLines" title="Line count">1 line</span>
      </footer>
    </section>

    <div class="divider" id="divider" role="separator" aria-orientation="vertical" tabindex="0"
         title="Drag to resize the panes, double-click to reset"></div>

    <section class="pane pane-preview" id="previewPane">
      <div class="preview-viewport" id="previewViewport">
        <article class="markdown-body" id="markdown"></article>
      </div>
      <div class="find-scroller" id="findScroller" aria-hidden="true" hidden></div>
      <footer class="statusbar statusbar-preview">
        <span class="status-item" id="statusRender" title="Renderer state">Ready</span>
        <span class="status-spacer"></span>
        <span class="status-item status-hint">Ctrl+F find &middot; Ctrl+T new tab &middot; Ctrl+W close tab</span>
      </footer>
    </section>
  </div>

  <div class="drop-overlay" id="dropOverlay" hidden>
    <div class="drop-card">
      <strong>Drop to open</strong>
      <span>.md, .markdown, .mdx, .txt</span>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <div class="jump-buttons" id="jumpButtons">
    <button type="button" class="jump-button" id="jumpTop" title="Scroll to top"
            aria-label="Scroll to top">
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M4 10l4-4 4 4"></path>
      </svg>
    </button>
    <button type="button" class="jump-button" id="jumpBottom" title="Scroll to bottom"
            aria-label="Scroll to bottom">
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M4 6l4 4 4-4"></path>
      </svg>
    </button>
  </div>

  <div class="menu" id="contextMenu" role="menu" hidden></div>

  <script src="vendor/marked.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/prism/prism.js"></script>
  <script src="vendor/mermaid/mermaid.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
